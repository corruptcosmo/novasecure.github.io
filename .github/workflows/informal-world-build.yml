name: Informal World Build

on:
  push:
    branches:
      - informal-voxel-cyber-concept
    paths:
      - 'informal-site/**'
      - '.github/workflows/informal-world-build.yml'
  pull_request:
    paths:
      - 'informal-site/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: informal-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build 3D site
        run: npm run build
