<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="shell nav-wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">HO</span>
        <span class="brand-copy">
          <strong>Hayden Ochoa</strong>
          <small>Cybersecurity Portfolio</small>
        </span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}#projects">Projects</a>
        <a href="{{ '/' | relative_url }}#skills">Skills</a>
        <a href="https://github.com/corruptcosmo">GitHub</a>
        <a href="https://www.linkedin.com/in/hayden-ochoa-b09a0b412/">LinkedIn</a>
      </nav>
    </div>
  </header>

  <main class="shell content-shell">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <span>Hayden Ochoa • Cybersecurity Portfolio</span>
      <span class="footer-mono">Learn. Prove. Apply. Improve.</span>
    </div>
  </footer>
</body>
</html>
