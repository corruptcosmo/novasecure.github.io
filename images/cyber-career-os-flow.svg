<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Cyber Career OS workflow</title>
  <desc id="desc">Diagram showing the Learn, Prove, Apply, Improve workflow of Cyber Career OS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16233d"/>
      <stop offset="100%" stop-color="#0f1a2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3dd9b8"/>
      <stop offset="100%" stop-color="#59b9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5bd0ff"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect x="30" y="30" width="1140" height="640" rx="26" fill="none" stroke="#23324d" stroke-width="2"/>

  <text x="70" y="95" fill="#f5f9ff" font-size="34" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Cyber Career OS</text>
  <text x="70" y="130" fill="#8fb0d1" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">Learn. Prove. Apply. Improve.</text>
  <rect x="70" y="150" width="260" height="6" rx="3" fill="url(#accent)"/>

  <g filter="url(#shadow)">
    <rect x="85" y="210" width="195" height="118" rx="20" fill="url(#card)" stroke="#29466a"/>
    <text x="110" y="246" fill="#3dd9b8" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">LEARN</text>
    <text x="110" y="278" fill="#eef5ff" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Training &amp; Labs</text>
    <text x="110" y="304" fill="#a8bdd9" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">Guided labs, mentor help,</text>
    <text x="110" y="324" fill="#a8bdd9" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">Proxmox ranges, SIEM drills</text>

    <rect x="355" y="210" width="195" height="118" rx="20" fill="url(#card)" stroke="#29466a"/>
    <text x="380" y="246" fill="#59b9ff" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">PROVE</text>
    <text x="380" y="278" fill="#eef5ff" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Evidence &amp; Portfolio</text>
    <text x="380" y="304" fill="#a8bdd9" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">Projects, assessments,</text>
    <text x="380" y="324" fill="#a8bdd9" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">verified skills, reports</text>

    <rect x="625" y="210" width="195" height="118" rx="20" fill="url(#card)" stroke="#29466a"/>
    <text x="650" y="246" fill="#8ae257" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">APPLY</text>
    <text x="650" y="278" fill="#eef5ff" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Career Engine</text>
    <text x="650" y="304" fill="#a8bdd9" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">Job analysis, resumes,</text>
    <text x="650" y="324" fill="#a8bdd9" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">applications, tracking</text>

    <rect x="895" y="210" width="195" height="118" rx="20" fill="url(#card)" stroke="#29466a"/>
    <text x="920" y="246" fill="#ffd166" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">IMPROVE</text>
    <text x="920" y="278" fill="#eef5ff" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Skill Gap Loop</text>
    <text x="920" y="304" fill="#a8bdd9" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">Missing skills become</text>
    <text x="920" y="324" fill="#a8bdd9" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">new labs and exercises</text>
  </g>

  <path d="M280 269 H340" stroke="#5bd0ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M550 269 H610" stroke="#5bd0ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M820 269 H880" stroke="#5bd0ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M993 335 C1000 425 755 485 600 485 C390 485 210 450 165 350" stroke="#3dd9b8" stroke-width="4" fill="none" stroke-dasharray="10 10" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="100" y="420" width="300" height="185" rx="24" fill="url(#card)" stroke="#29466a"/>
    <text x="130" y="458" fill="#eef5ff" font-size="23" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">What the platform connects</text>
    <text x="130" y="492" fill="#a8bdd9" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">• Job market requirements</text>
    <text x="130" y="518" fill="#a8bdd9" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">• Verified hands-on learning</text>
    <text x="130" y="544" fill="#a8bdd9" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">• Portfolio-ready evidence</text>
    <text x="130" y="570" fill="#a8bdd9" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">• Truthful job applications</text>

    <rect x="450" y="420" width="300" height="185" rx="24" fill="url(#card)" stroke="#29466a"/>
    <text x="480" y="458" fill="#eef5ff" font-size="23" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Security principles</text>
    <text x="480" y="492" fill="#a8bdd9" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">• Local-first and privacy-conscious</text>
    <text x="480" y="518" fill="#a8bdd9" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">• Least privilege everywhere</text>
    <text x="480" y="544" fill="#a8bdd9" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">• Human approval for risky actions</text>
    <text x="480" y="570" fill="#a8bdd9" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">• Evidence-backed professional claims</text>

    <rect x="800" y="420" width="300" height="185" rx="24" fill="url(#card)" stroke="#29466a"/>
    <text x="830" y="458" fill="#eef5ff" font-size="23" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">V0.1 emphasis</text>
    <text x="830" y="492" fill="#a8bdd9" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">• Architecture and documentation</text>
    <text x="830" y="518" fill="#a8bdd9" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">• Provider abstractions</text>
    <text x="830" y="544" fill="#a8bdd9" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">• Approval and audit systems</text>
    <text x="830" y="570" fill="#a8bdd9" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">• Foundation for V1–V4 growth</text>
  </g>
</svg>
