<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Cyber Career OS roadmap</title>
  <desc id="desc">Roadmap diagram showing V1 through V4 evolution of Cyber Career OS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16233d"/>
      <stop offset="100%" stop-color="#0f1a2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3dd9b8"/>
      <stop offset="100%" stop-color="#59b9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5bd0ff"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <text x="70" y="90" fill="#f5f9ff" font-size="34" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Cyber Career OS Roadmap</text>
  <text x="70" y="125" fill="#8fb0d1" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">A progression from personal project to open community platform</text>
  <rect x="70" y="145" width="360" height="6" rx="3" fill="url(#accent)"/>

  <line x1="155" y1="300" x2="1045" y2="300" stroke="#29466a" stroke-width="8" stroke-linecap="round"/>
  <line x1="155" y1="300" x2="1045" y2="300" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="70" y="200" width="215" height="220" rx="22" fill="url(#card)" stroke="#29466a"/>
    <circle cx="178" cy="300" r="32" fill="#13263f" stroke="#3dd9b8" stroke-width="3"/>
    <text x="162" y="308" fill="#3dd9b8" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800">V1</text>
    <text x="96" y="248" fill="#eef5ff" font-size="23" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Personal Career OS</text>
    <text x="96" y="352" fill="#a8bdd9" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">• Job discovery and analysis</text>
    <text x="96" y="376" fill="#a8bdd9" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">• Resume and application tools</text>
    <text x="96" y="400" fill="#a8bdd9" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">• Verified profile and evidence</text>

    <rect x="335" y="170" width="215" height="250" rx="22" fill="url(#card)" stroke="#29466a"/>
    <circle cx="443" cy="300" r="32" fill="#13263f" stroke="#59b9ff" stroke-width="3"/>
    <text x="427" y="308" fill="#59b9ff" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800">V2</text>
    <text x="361" y="218" fill="#eef5ff" font-size="23" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Adaptive Training</text>
    <text x="361" y="352" fill="#a8bdd9" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">• Ollama and local AI routing</text>
    <text x="361" y="376" fill="#a8bdd9" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">• Purple Team mode</text>
    <text x="361" y="400" fill="#a8bdd9" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">• Detection engineering and replay</text>

    <rect x="600" y="200" width="215" height="220" rx="22" fill="url(#card)" stroke="#29466a"/>
    <circle cx="708" cy="300" r="32" fill="#13263f" stroke="#8ae257" stroke-width="3"/>
    <text x="692" y="308" fill="#8ae257" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800">V3</text>
    <text x="626" y="248" fill="#eef5ff" font-size="23" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Public Platform</text>
    <text x="626" y="352" fill="#a8bdd9" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">• Multi-user architecture</text>
    <text x="626" y="376" fill="#a8bdd9" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">• Community packs and plugins</text>
    <text x="626" y="400" fill="#a8bdd9" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">• Open-source contributor model</text>

    <rect x="865" y="170" width="215" height="250" rx="22" fill="url(#card)" stroke="#29466a"/>
    <circle cx="973" cy="300" r="32" fill="#13263f" stroke="#ffd166" stroke-width="3"/>
    <text x="957" y="308" fill="#ffd166" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800">V4</text>
    <text x="891" y="218" fill="#eef5ff" font-size="23" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">OS Distribution</text>
    <text x="891" y="352" fill="#a8bdd9" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">• Self-hosted setup wizard</text>
    <text x="891" y="376" fill="#a8bdd9" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">• Built-in AI, SIEM, and range</text>
    <text x="891" y="400" fill="#a8bdd9" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">• Hardware-aware deployment</text>
  </g>

  <path d="M286 300 H320" stroke="#5bd0ff" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M551 300 H585" stroke="#5bd0ff" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M816 300 H850" stroke="#5bd0ff" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="70" y="545" fill="#cfe0f3" font-size="17" font-family="Inter,Segoe UI,Arial,sans-serif">Foundation before scale:</text>
  <text x="245" y="545" fill="#8fb0d1" font-size="17" font-family="Inter,Segoe UI,Arial,sans-serif">provider abstractions • least privilege • audit logs • documentation • evidence-backed claims</text>
</svg>
