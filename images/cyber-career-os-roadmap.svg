<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Cyber Career OS roadmap</title>
  <desc id="desc">Roadmap diagram showing the V1 through V4 evolution of Cyber Career OS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0b1220"/><stop offset="100%" stop-color="#111a2e"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#16233d"/><stop offset="100%" stop-color="#0f1a2d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3dd9b8"/><stop offset="100%" stop-color="#59b9ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5bd0ff"/></marker>
  </defs>
  <rect width="1200" height="660" fill="url(#bg)"/>
  <text x="70" y="90" fill="#f5f9ff" font-size="34" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Cyber Career OS Roadmap</text>
  <text x="70" y="125" fill="#8fb0d1" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">From a personal career system to an adaptive, reusable security platform</text>
  <rect x="70" y="145" width="360" height="6" rx="3" fill="url(#accent)"/>

  <line x1="155" y1="305" x2="1045" y2="305" stroke="#29466a" stroke-width="8" stroke-linecap="round"/>
  <line x1="155" y1="305" x2="1045" y2="305" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="45" y="190" width="255" height="255" rx="22" fill="url(#card)" stroke="#29466a"/>
    <circle cx="173" cy="305" r="32" fill="#13263f" stroke="#3dd9b8" stroke-width="3"/>
    <text x="157" y="313" fill="#3dd9b8" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800">V1</text>
    <text x="70" y="230" fill="#eef5ff" font-size="20" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Personal Career OS</text>
    <text x="70" y="365" fill="#a8bdd9" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif">• Job discovery and analysis</text>
    <text x="70" y="389" fill="#a8bdd9" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif">• Resume / application tools</text>
    <text x="70" y="413" fill="#a8bdd9" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif">• Verified profile and evidence</text>

    <rect x="330" y="165" width="255" height="280" rx="22" fill="url(#card)" stroke="#29466a"/>
    <circle cx="458" cy="305" r="32" fill="#13263f" stroke="#59b9ff" stroke-width="3"/>
    <text x="442" y="313" fill="#59b9ff" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800">V2</text>
    <text x="355" y="205" fill="#eef5ff" font-size="20" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Adaptive Training</text>
    <text x="355" y="365" fill="#a8bdd9" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif">• Deeper model routing</text>
    <text x="355" y="389" fill="#a8bdd9" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif">• Purple Team workflows</text>
    <text x="355" y="413" fill="#a8bdd9" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif">• Detection engineering / replay</text>

    <rect x="615" y="190" width="255" height="255" rx="22" fill="url(#card)" stroke="#29466a"/>
    <circle cx="743" cy="305" r="32" fill="#13263f" stroke="#8ae257" stroke-width="3"/>
    <text x="727" y="313" fill="#8ae257" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800">V3</text>
    <text x="640" y="230" fill="#eef5ff" font-size="20" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Public Platform</text>
    <text x="640" y="365" fill="#a8bdd9" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif">• Multi-user architecture</text>
    <text x="640" y="389" fill="#a8bdd9" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif">• Community packs / plugins</text>
    <text x="640" y="413" fill="#a8bdd9" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif">• Open-source contributor model</text>

    <rect x="900" y="165" width="255" height="280" rx="22" fill="url(#card)" stroke="#29466a"/>
    <circle cx="1028" cy="305" r="32" fill="#13263f" stroke="#ffd166" stroke-width="3"/>
    <text x="1012" y="313" fill="#ffd166" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="800">V4</text>
    <text x="925" y="205" fill="#eef5ff" font-size="20" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">OS Distribution</text>
    <text x="925" y="365" fill="#a8bdd9" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif">• Guided self-hosted setup</text>
    <text x="925" y="389" fill="#a8bdd9" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif">• Built-in AI, SIEM and range</text>
    <text x="925" y="413" fill="#a8bdd9" font-size="14" font-family="Inter,Segoe UI,Arial,sans-serif">• Hardware-aware deployment</text>
  </g>

  <path d="M300 305 H315" stroke="#5bd0ff" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M585 305 H600" stroke="#5bd0ff" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M870 305 H885" stroke="#5bd0ff" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="70" y="535" fill="#cfe0f3" font-size="17" font-family="Inter,Segoe UI,Arial,sans-serif">Current V1 path:</text>
  <text x="205" y="535" fill="#8fb0d1" font-size="17" font-family="Inter,Segoe UI,Arial,sans-serif">Indev 0.4 → Infdev 0.5 → Alpha 0.6/0.7 → Beta 0.8/0.9 → Release 1.0</text>
  <text x="70" y="575" fill="#cfe0f3" font-size="17" font-family="Inter,Segoe UI,Arial,sans-serif">Foundation before scale:</text>
  <text x="245" y="575" fill="#8fb0d1" font-size="17" font-family="Inter,Segoe UI,Arial,sans-serif">provider abstractions • least privilege • audit logs • documentation • evidence-backed claims</text>
</svg>
