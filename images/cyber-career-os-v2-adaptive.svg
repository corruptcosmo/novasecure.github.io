<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Cyber Career OS V2 adaptive operations concept</title>
  <desc id="desc">Animated concept diagram for adaptive cyber operations and training after version 1.0.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#09131f"/><stop offset="1" stop-color="#0f1d2d"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#65d1ff"/><stop offset="1" stop-color="#8bf0c8"/></linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#bg2)"/>
  <rect x="28" y="28" width="1144" height="504" rx="22" fill="none" stroke="#223348"/>
  <text x="62" y="78" fill="#eef4f8" font-size="29" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Beyond 1.0: Adaptive Cyber Operations &amp; Training</text>
  <text x="62" y="110" fill="#98a8b8" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">V2 evolves fixed exercises into a persistent environment that adapts to performance.</text>

  <circle cx="600" cy="310" r="112" fill="#101d2b" stroke="url(#ring)" stroke-width="3" filter="url(#g)"/>
  <circle cx="600" cy="310" r="88" fill="#0c1723" stroke="#223348"/>
  <text x="600" y="288" text-anchor="middle" fill="#8bf0c8" font-size="14" font-family="monospace" font-weight="700">ADAPTIVE CORE</text>
  <text x="600" y="324" text-anchor="middle" fill="#eef4f8" font-size="25" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Performance</text>
  <text x="600" y="351" text-anchor="middle" fill="#98a8b8" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">changes what comes next</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(82 190)"><rect width="230" height="118" rx="18" fill="#101d2b" stroke="#31526e"/><text x="22" y="34" fill="#65d1ff" font-size="13" font-family="monospace" font-weight="700">SOC SHIFT</text><text x="22" y="66" fill="#eef4f8" font-size="20" font-weight="700">Noise + incidents</text><text x="22" y="91" fill="#98a8b8" font-size="14">prioritize • triage • escalate</text></g>
    <g transform="translate(82 360)"><rect width="230" height="118" rx="18" fill="#101d2b" stroke="#31526e"/><text x="22" y="34" fill="#8bf0c8" font-size="13" font-family="monospace" font-weight="700">TEAM</text><text x="22" y="66" fill="#eef4f8" font-size="20" font-weight="700">Virtual coworkers</text><text x="22" y="91" fill="#98a8b8" font-size="14">lead • hunter • IR • detection</text></g>
    <g transform="translate(888 190)"><rect width="230" height="118" rx="18" fill="#101d2b" stroke="#31526e"/><text x="22" y="34" fill="#ffd166" font-size="13" font-family="monospace" font-weight="700">HUNT + DETECT</text><text x="22" y="66" fill="#eef4f8" font-size="20" font-weight="700">Build better signals</text><text x="22" y="91" fill="#98a8b8" font-size="14">hunt • replay • tune rules</text></g>
    <g transform="translate(888 360)"><rect width="230" height="118" rx="18" fill="#101d2b" stroke="#31526e"/><text x="22" y="34" fill="#65d1ff" font-size="13" font-family="monospace" font-weight="700">DFIR</text><text x="22" y="66" fill="#eef4f8" font-size="20" font-weight="700">Forensics + command</text><text x="22" y="91" fill="#98a8b8" font-size="14">artifacts • decisions • response</text></g>
  </g>

  <g fill="none" stroke="#35536d" stroke-width="3" stroke-dasharray="7 9">
    <path d="M312 250 C410 250 440 280 488 300"/><path d="M312 419 C420 405 448 360 493 337"/><path d="M712 300 C760 280 790 250 888 250"/><path d="M707 338 C752 365 785 410 888 419"/>
  </g>
  <g fill="#8bf0c8" filter="url(#g)">
    <circle r="6"><animateMotion dur="4.6s" repeatCount="indefinite" path="M312 250 C410 250 440 280 488 300"/></circle>
    <circle r="6"><animateMotion begin="-1.2s" dur="4.8s" repeatCount="indefinite" path="M312 419 C420 405 448 360 493 337"/></circle>
    <circle r="6"><animateMotion begin="-2s" dur="4.4s" repeatCount="indefinite" path="M712 300 C760 280 790 250 888 250"/></circle>
    <circle r="6"><animateMotion begin="-.8s" dur="5s" repeatCount="indefinite" path="M707 338 C752 365 785 410 888 419"/></circle>
  </g>
  <circle cx="600" cy="310" r="126" fill="none" stroke="#65d1ff" stroke-width="1" opacity=".28" stroke-dasharray="5 10"><animateTransform attributeName="transform" type="rotate" from="0 600 310" to="360 600 310" dur="18s" repeatCount="indefinite"/></circle>
</svg>